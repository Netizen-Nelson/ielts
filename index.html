<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Nelson IELTS: Reading Test</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
:root {
  --bg:       #0C0D0C;
  --shell:    #C6C7BD;
  --lavender: #C3A5E5;
  --special:  #C8DD5A;
  --warning:  #F08080;
  --salmon:   #E5C3B3;
  --sky:      #08A9D1;
  --safe:     #40C99A;
  --vanilla:  #DBEDD8;
  --yellow:   #DECA4B;
  --focus:    #A0CF72;
  --info:     #4285EB;
  --stone:    #95BDD7;
  --indigo:   #7B6CF0;
  --pink:     #FFB3D9;
  --orange:   #EDA109;

  --pane-bg:    #111210;
  --border:     #252625;
  --border-mid: #383938;
  --font-ui:    'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --font-body:  Georgia, 'Times New Roman', serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--shell);
  font-family: var(--font-ui);
  font-size: 1rem;
}

#top-bar {
  height: 50px;
  background: #161714;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
  z-index: 200;
}

#test-title {
  font-size: 0.88rem;
  color: var(--lavender);
  font-weight: 700;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

#passage-tabs {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.passage-tab {
  padding: 4px 14px;
  border-radius: 4px;
  border: 1px solid var(--border-mid);
  background: transparent;
  color: var(--shell);
  font-size: 0.82rem;
  font-family: var(--font-ui);
  cursor: pointer;
  transition: all 0.16s;
  white-space: nowrap;
}
.passage-tab:hover { border-color: var(--lavender); color: var(--lavender); }
.passage-tab.active {
  background: var(--lavender);
  color: #0C0D0C;
  border-color: var(--lavender);
  font-weight: 700;
}

#timer-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 14px;
  border: 1px solid var(--border-mid);
  border-radius: 4px;
  flex-shrink: 0;
}
#timer-label {
  font-size: 0.72rem;
  color: var(--shell);
  opacity: 0.5;
  letter-spacing: 0.08em;
}
#timer-display {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 1rem;
  color: var(--safe);
  letter-spacing: 0.06em;
  min-width: 52px;
}
#timer-display.warn   { color: var(--yellow); }
#timer-display.danger { color: var(--warning); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ══════════════════════════════════════════
   MAIN SPLIT LAYOUT
══════════════════════════════════════════ */
#main-layout {
  display: flex;
  height: calc(100vh - 50px);
  overflow: hidden;
}

/* ── LEFT PANE ─────────────────────────── */
#left-pane {
  display: flex;
  flex-direction: column;
  width: 50%;
  min-width: 260px;
  flex-shrink: 0;
  overflow: hidden;
  background: var(--pane-bg);
  border-right: 1px solid var(--border);
}

#passage-title-bar {
  padding: 10px 22px 9px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: #131412;
}
#passage-range {
  font-size: 0.72rem;
  color: var(--sky);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
#passage-heading {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--vanilla);
  font-family: var(--font-body);
}

#passage-body {
  flex: 1;
  overflow-y: auto;
  padding: 22px 26px;
  line-height: 1.95;
  font-size: 1rem;
  color: var(--shell);
  font-family: var(--font-body);
}
#passage-body p { margin-bottom: 16px; }
#passage-body p:last-child { margin-bottom: 0; }

/* ── HIGHLIGHTS ────────────────────────── */
mark.hl {
  border-radius: 2px;
  padding: 1px 0;
  cursor: pointer;
  border-bottom: none !important;
  font-family: inherit;
  transition: box-shadow 0.15s;
}
mark.hl-yellow   { background: rgba(222,202,75, 0.38); color: inherit; }
mark.hl-sky      { background: rgba(8,169,209,  0.30); color: inherit; }
mark.hl-safe     { background: rgba(64,201,154, 0.30); color: inherit; }
mark.hl-warning  { background: rgba(240,128,128,0.36); color: inherit; }
mark.hl-lavender { background: rgba(195,165,229,0.36); color: inherit; }
mark.hl.xpop-panel-active {
  box-shadow: 0 0 0 2px rgba(195,165,229,0.7);
}

/* ── NOTE PANEL ────────────────────────── */
#note-panel-wrap {
  border-top: 1px solid var(--border);
  background: #0e0f0e;
  flex-shrink: 0;
  max-height: 260px;
  display: flex;
  flex-direction: column;
}
#note-panel-header {
  display: flex;
  align-items: center;
  padding: 7px 16px;
  cursor: pointer;
  user-select: none;
  gap: 7px;
  flex-shrink: 0;
  border-bottom: 1px solid transparent;
  transition: border-color 0.18s;
}
#note-panel-header:hover { border-bottom-color: var(--border); }
#note-panel-icon { font-size: 0.9rem; }
#note-panel-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--lavender);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
#note-panel-hint {
  font-size: 0.75rem;
  color: var(--shell);
  opacity: 0.38;
  margin-left: auto;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#note-chevron { font-size: 0.7rem; opacity: 0.4; }

#note-panel-body {
  overflow-y: auto;
  padding: 8px 16px 12px;
  flex: 1;
}
#note-panel-body.collapsed { display: none; }

/* bp-popnote renders into #note-panel */
#note-panel { min-height: 20px; }

#note-edit-area { display: none; margin-top: 10px; }
#note-textarea {
  width: 100%;
  rows: 3;
  background: #1a1c1a;
  border: 1px solid var(--border-mid);
  border-radius: 4px;
  color: var(--shell);
  font-size: 0.88rem;
  font-family: var(--font-ui);
  padding: 8px 10px;
  resize: vertical;
  min-height: 64px;
  outline: none;
  transition: border-color 0.18s;
  display: block;
}
#note-textarea:focus { border-color: var(--lavender); }
#note-edit-btns { display: flex; gap: 8px; margin-top: 7px; flex-wrap: wrap; }
.note-btn {
  padding: 4px 14px;
  border-radius: 4px;
  border: 1px solid;
  font-size: 0.8rem;
  font-family: var(--font-ui);
  cursor: pointer;
  transition: all 0.16s;
  background: transparent;
}
#note-save-btn  { border-color: var(--safe);    color: var(--safe);    }
#note-save-btn:hover  { background: var(--safe);    color: #0C0D0C; }
#note-del-btn   { border-color: var(--warning); color: var(--warning); }
#note-del-btn:hover   { background: var(--warning); color: #0C0D0C; }
#note-desel-btn { border-color: var(--border-mid); color: var(--shell); opacity: 0.5; }
#note-desel-btn:hover { opacity: 1; }

/* ── DIVIDER ───────────────────────────── */
#divider {
  width: 6px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  position: relative;
  user-select: none;
  transition: background 0.16s;
}
#divider:hover, #divider.dragging { background: var(--lavender); }
#divider::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 1px;
  width: 4px;
  height: 36px;
  transform: translateY(-50%);
  border-left:  1px solid rgba(255,255,255,0.12);
  border-right: 1px solid rgba(255,255,255,0.12);
}

/* ── RIGHT PANE ────────────────────────── */
#right-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  min-width: 260px;
}

#q-nav-wrap {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  flex-shrink: 0;
  background: #101110;
}
.q-nav-btn {
  width: 30px;
  height: 30px;
  border-radius: 4px;
  border: 1px solid var(--border-mid);
  background: transparent;
  color: var(--shell);
  font-size: 0.76rem;
  font-family: var(--font-ui);
  cursor: pointer;
  transition: all 0.16s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
  padding: 0;
}
.q-nav-btn:hover   { border-color: var(--lavender); color: var(--lavender); }
.q-nav-btn.answered { background: rgba(195,165,229,0.2); border-color: var(--lavender); color: var(--lavender); }
.q-nav-btn.flagged  { border-color: var(--yellow); color: var(--yellow); }
.q-nav-btn.answered.flagged { background: rgba(222,202,75,0.18); border-color: var(--yellow); }
.q-nav-btn.current  { box-shadow: 0 0 0 2px var(--sky); }

#question-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 22px;
}

/* ── QUESTION GROUPS ───────────────────── */
.q-group { margin-bottom: 34px; }
.q-group:last-child { margin-bottom: 0; }
.q-group-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin-bottom: 22px;
}

.q-instruction {
  font-size: 0.9rem;
  color: var(--vanilla);
  line-height: 1.6;
  margin-bottom: 6px;
  font-style: italic;
}
.q-sub-instruction {
  font-size: 0.8rem;
  color: var(--sky);
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 16px;
}

.match-options-box {
  margin-bottom: 16px;
  padding: 12px 14px;
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--border);
  border-radius: 5px;
}
.match-opt-item {
  font-size: 0.86rem;
  color: var(--shell);
  margin-bottom: 5px;
  line-height: 1.5;
  display: flex;
  gap: 8px;
}
.match-opt-item:last-child { margin-bottom: 0; }
.match-opt-key { color: var(--lavender); font-weight: 700; flex-shrink: 0; min-width: 22px; }

/* ── QUESTION ITEM ─────────────────────── */
.q-item { margin-bottom: 20px; scroll-margin-top: 16px; }
.q-item:last-child { margin-bottom: 0; }

.q-num-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}
.q-number {
  font-size: 0.78rem;
  color: var(--lavender);
  font-weight: 700;
  letter-spacing: 0.04em;
}
.q-flag-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
  opacity: 0.25;
  padding: 0 2px;
  line-height: 1;
  transition: opacity 0.16s, color 0.16s;
  color: var(--shell);
}
.q-flag-btn:hover { opacity: 0.8; }
.q-flag-btn.flagged { opacity: 1; color: var(--yellow); }

.q-prompt {
  font-size: 0.95rem;
  color: var(--shell);
  line-height: 1.65;
  margin-bottom: 9px;
}

/* Multiple choice */
.mc-list { display: flex; flex-direction: column; gap: 6px; }
.mc-opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 12px;
  border-radius: 5px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.16s;
  font-size: 0.9rem;
  line-height: 1.5;
}
.mc-opt:hover { border-color: var(--lavender); background: rgba(195,165,229,0.06); }
.mc-opt.selected { border-color: var(--lavender); background: rgba(195,165,229,0.14); }
.mc-opt input { display: none; }
.mc-key { font-weight: 700; color: var(--lavender); flex-shrink: 0; min-width: 18px; }
.mc-opt.selected .mc-key { color: var(--special); }

/* TFNG / YNNG */
.tfng-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.tfng-btn {
  padding: 6px 16px;
  border-radius: 4px;
  border: 1px solid var(--border-mid);
  background: transparent;
  color: var(--shell);
  font-size: 0.84rem;
  font-family: var(--font-ui);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.16s;
}
.tfng-btn:hover { border-color: var(--lavender); color: var(--lavender); }
.tfng-btn.selected { background: var(--lavender); color: #0C0D0C; border-color: var(--lavender); font-weight: 700; }

/* Matching dropdown */
.match-select {
  background: #1a1c1a;
  border: 1px solid var(--border-mid);
  border-radius: 4px;
  color: var(--shell);
  font-size: 0.88rem;
  font-family: var(--font-ui);
  padding: 6px 10px;
  min-width: 200px;
  max-width: 100%;
  outline: none;
  cursor: pointer;
  transition: border-color 0.16s;
}
.match-select:focus { border-color: var(--lavender); }

/* Text / completion inputs */
.text-input {
  width: 100%;
  background: #1a1c1a;
  border: 1px solid var(--border-mid);
  border-radius: 4px;
  color: var(--shell);
  font-size: 0.9rem;
  font-family: var(--font-ui);
  padding: 7px 12px;
  outline: none;
  transition: border-color 0.16s;
  margin-top: 4px;
  display: block;
}
.text-input:focus { border-color: var(--lavender); }

/* ══════════════════════════════════════════
   HIGHLIGHT TOOLBAR
══════════════════════════════════════════ */
#hl-toolbar {
  position: fixed;
  display: none;
  align-items: center;
  gap: 5px;
  background: #1c1e1c;
  border: 1px solid var(--border-mid);
  border-radius: 6px;
  padding: 5px 8px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.65);
  z-index: 9998;
}
.hl-color-btn {
  width: 20px;
  height: 20px;
  border-radius: 3px;
  border: none;
  cursor: pointer;
  transition: transform 0.14s;
  flex-shrink: 0;
}
.hl-color-btn:hover { transform: scale(1.25); }
.hl-sep { width: 1px; height: 16px; background: var(--border-mid); flex-shrink: 0; }
.hl-remove-btn {
  background: none;
  border: none;
  color: var(--warning);
  cursor: pointer;
  font-size: 0.78rem;
  padding: 2px 5px;
  border-radius: 3px;
  transition: background 0.14s;
  font-family: var(--font-ui);
}
.hl-remove-btn:hover { background: rgba(240,128,128,0.15); }

/* ══════════════════════════════════════════
   LOADING SCREEN
══════════════════════════════════════════ */
#loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  z-index: 9999;
}
#loading-screen.hidden { display: none; }
.spinner {
  width: 38px;
  height: 38px;
  border: 3px solid var(--border-mid);
  border-top-color: var(--lavender);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-msg { font-size: 0.88rem; color: var(--lavender); letter-spacing: 0.04em; }

/* ══════════════════════════════════════════
   SCROLLBARS
══════════════════════════════════════════ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #353635; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #505250; }

/* Bootstrap override: prevent white bg on selects */
select.match-select option { background: #1a1c1a; color: var(--shell); }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div id="loading-msg">Loading test …</div>
</div>

<!-- Top Bar -->
<div id="top-bar">
  <div id="test-title">IELTS Reading</div>
  <div id="passage-tabs"></div>
  <div id="timer-wrap">
    <span id="timer-label">TIME</span>
    <span id="timer-display">60:00</span>
  </div>
</div>

<!-- Main Layout -->
<div id="main-layout">
  <!-- LEFT: Passage -->
  <div id="left-pane">
    <div id="passage-title-bar">
		<div>
			<a href="ielts_chunking_benefits.html"
			   style="display:inline-flex;align-items:center;gap:8px;
					  padding:8px 20px;border-radius:6px;
					  background:transparent;border:1px solid #C3A5E5;
					  color:#C3A5E5;font-size:0.88rem;font-weight:600;
					  letter-spacing:0.04em;text-decoration:none;
					  transition:background 0.18s,color 0.18s;"
			   onmouseover="this.style.background='#C3A5E5';this.style.color='#0C0D0C'"
			   onmouseout="this.style.background='transparent';this.style.color='#C3A5E5'">
			  See Chunking Benefits
			</a>
		</div>
      <div id="passage-range">Questions —</div>
      <div id="passage-heading">—</div>
    </div>
    <div id="passage-body"></div>

    <!-- Annotation Panel (bp-popnote panel target = #note-panel) -->
    <div id="note-panel-wrap">
      <div id="note-panel-header" onclick="IELTSApp.toggleNotePanel()">
        <span id="note-panel-icon">📝</span>
        <span id="note-panel-label">Annotation</span>
        <span id="note-panel-hint">Click a highlight to edit its note</span>
        <span id="note-chevron">▲</span>
      </div>
      <div id="note-panel-body">
        <!-- Edit area: textarea for adding/editing notes on highlights -->
        <div id="note-edit-area">
          <textarea id="note-textarea" rows="3" placeholder="Add a note to this highlight…"></textarea>
          <div id="note-edit-btns">
            <button class="note-btn" id="note-save-btn"  onclick="IELTSApp.saveNote()">Save note</button>
            <button class="note-btn" id="note-del-btn"   onclick="IELTSApp.deleteHighlight()">Remove highlight</button>
            <button class="note-btn" id="note-desel-btn" onclick="IELTSApp.deactivateMark()">✕ Deselect</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- DIVIDER -->
  <div id="divider"></div>

  <!-- RIGHT: Questions -->
  <div id="right-pane">
    <div id="q-nav-wrap"></div>
    <div id="question-body"></div>
  </div>

</div>

<!-- Highlight Toolbar -->
<div id="hl-toolbar">
  <button class="hl-color-btn" data-color="yellow"   title="Yellow"
    style="background:rgba(222,202,75,0.75)"></button>
  <button class="hl-color-btn" data-color="safe"     title="Green"
    style="background:rgba(64,201,154,0.75)"></button>
  <button class="hl-color-btn" data-color="sky"      title="Blue"
    style="background:rgba(8,169,209,0.75)"></button>
  <button class="hl-color-btn" data-color="warning"  title="Red"
    style="background:rgba(240,128,128,0.75)"></button>
  <button class="hl-color-btn" data-color="lavender" title="Purple"
    style="background:rgba(195,165,229,0.75)"></button>
  <div class="hl-sep"></div>
  <button class="hl-remove-btn" id="hl-remove-btn" title="Remove highlight">✕</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function () {
  'use strict';

  const CSS = `
    [data-popover-title],
    [data-popover-content],
    [data-popover-target] {
      cursor: pointer;
      border-bottom-width: 1px;
      border-bottom-style: dashed;
      border-bottom-color: var(--xpop-hint-color, #C3A5E5);
      transition: border-color 0.2s, color 0.2s;
    }
    [data-popover-hint="false"] {
      border-bottom: none !important;
    }

    /* ── Floating popup ──────────────────────────────────────── */
    .xpop-container {
      position: fixed;
      z-index: 99999;
      max-width: var(--xpop-max-width, 560px);
      min-width: 220px;
      border-radius: 8px;
      border-width: 1px;
      border-style: var(--xpop-border-style, solid);
      border-color: var(--xpop-border-color, #C3A5E5);
      background: var(--xpop-bg, #130e1e);
      font-size: var(--xpop-font-size, 1rem);
      color: #c6c7bd;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
      pointer-events: auto;
      font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      line-height: 1.6;
      opacity: 0;
      transform: scale(0.88);
      transform-origin: var(--xpop-origin, center bottom);
      transition: opacity 0.22s cubic-bezier(.4,0,.2,1),
                  transform 0.22s cubic-bezier(.4,0,.2,1);
    }
    .xpop-container.xpop-visible {
      opacity: 1;
      transform: scale(1);
    }
    .xpop-arrow {
      position: absolute;
      width: 0;
      height: 0;
      border: 8px solid transparent;
    }
    .xpop-container[data-placement="top"] .xpop-arrow {
      bottom: -16px; left: 50%;
      transform: translateX(-50%);
      border-top-color: var(--xpop-border-color, #C3A5E5);
    }
    .xpop-container[data-placement="bottom"] .xpop-arrow {

    panelTarget: null, _customThemes: {},

  window.PopoverConfig = {

  function getTheme(n)  { return config._customThemes[n] || THEMES[n] || THEMES.dark; }

  function injectCSS() {
    if (document.getElementById('bp-popnote-style')) return;

  function calcPosition(trigger, pop, placement, offset) {
    const tr = trigger.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    const vw = window.innerWidth,  vh = window.innerHeight;
    const pos = {
      top:    { top: tr.top  - ph - offset,         left: tr.left + tr.width/2  - pw/2 },
      bottom: { top: tr.bottom + offset,             left: tr.left + tr.width/2  - pw/2 },
      left:   { top: tr.top  + tr.height/2 - ph/2,  left: tr.left - pw - offset        },
      right:  { top: tr.top  + tr.height/2 - ph/2,  left: tr.right + offset            },
    };
    let p = placement;
    if (p==='top'    && pos.top.top    < 8)         p = 'bottom';
    if (p==='bottom' && pos.bottom.top + ph > vh-8) p = 'top';
    if (p==='left'   && pos.left.left  < 8)         p = 'right';
    if (p==='right'  && pos.right.left + pw > vw-8) p = 'left';
    let { top, left } = pos[p];
    left = Math.max(8, Math.min(left, vw-pw-8));
    top  = Math.max(8, Math.min(top,  vh-ph-8));
    return { top, left, finalPlacement: p };
  }

  function originOf(p) {
    return ({top:'center bottom',bottom:'center top',left:'right center',right:'left center'})[p] || 'center bottom';
  }

  function extractContent(trigger) {
    const targetId = trigger.dataset.popoverTarget || '';
    if (targetId) {
      const tpl = document.querySelector(targetId);
      if (tpl && tpl.content) {
        const d = document.createElement('div');
        d.appendChild(tpl.content.cloneNode(true));
        return d.innerHTML;
      }
      if (tpl) return tpl.innerHTML;
    }
    return trigger.dataset.popoverContent || '';

  function buildContentDOM(html) {
    const tmp  = document.createElement('div');
    tmp.innerHTML = html;
    const secs = Array.from(tmp.querySelectorAll(':scope > section'));
    const isCarousel = secs.length > 1;
    const body = document.createElement('div');
    body.className = 'xpop-body';
    let progressEl = null, barEl = null;
    if (isCarousel) {
      const track = document.createElement('div');
      track.className = 'xpop-carousel-track';
      secs.forEach(sec => {
        const s = document.createElement('section');
        s.innerHTML = sec.innerHTML;
        track.appendChild(s);

      body.appendChild(track);
      progressEl = document.createElement('div');
      progressEl.className = 'xpop-progress';
      const pb = document.createElement('div');
      pb.className = 'xpop-progress-bar';
      progressEl.appendChild(pb);
      const bar  = document.createElement('div');
      bar.className = 'xpop-carousel-bar';
      const dots = document.createElement('div');
      dots.className = 'xpop-dots';
      const nav  = document.createElement('div');
      nav.className = 'xpop-nav';
      const bp = document.createElement('button');
      bp.className = 'xpop-nav-btn'; bp.dataset.dir = '-1'; bp.innerHTML = '&#8593;';
      const bn = document.createElement('button');
      bn.className = 'xpop-nav-btn'; bn.dataset.dir = '1';  bn.innerHTML = '&#8595;';

      nav.appendChild(bp); nav.appendChild(ctr); nav.appendChild(bn);

  function buildCarousel(sections, wrap, interval, animType) {
    const track    = wrap.querySelector('.xpop-carousel-track');
    const dotsWrap = wrap.querySelector('.xpop-dots');
    const btnPrev  = wrap.querySelector('.xpop-nav-btn[data-dir="-1"]');
    const btnNext  = wrap.querySelector('.xpop-nav-btn[data-dir="1"]');
    const counter  = wrap.querySelector('.xpop-counter');
    const pBar     = wrap.querySelector('.xpop-progress-bar');
    const total    = sections.length;
    let cur = 0, timer = null;
    if (animType === 'crossfade') track.classList.add('xpop-crossfade');
    sections.forEach((_, i) => {
      const d = document.createElement('button');
      d.className = 'xpop-dot' + (i===0 ? ' xpop-dot-active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(d);
    });
    function syncUI() {
      const dots = dotsWrap.querySelectorAll('.xpop-dot');
      dots.forEach((d,i) => d.classList.toggle('xpop-dot-active', i===cur));
      if (counter) counter.textContent = (cur+1) + ' / ' + total;
      if (btnPrev) btnPrev.disabled = cur === 0;
      if (btnNext) btnNext.disabled = cur === total-1;
    }
    function goTo(idx) {
      if (idx < 0 || idx >= total) return;
      const dir  = idx > cur ? 'forward' : 'back';
      const prev = cur;
      cur = idx;
      sections[prev].classList.remove('xpop-active', 'xpop-anim-forward', 'xpop-anim-back');
      const nxt = sections[cur];
      nxt.classList.remove('xpop-anim-forward', 'xpop-anim-back');
      void nxt.offsetWidth;
      nxt.classList.add('xpop-active', dir==='forward' ? 'xpop-anim-forward' : 'xpop-anim-back');
      syncUI();
      startProgress();
    }
    function startProgress() {
      clearTimeout(timer);
      if (pBar) { pBar.style.transition = 'none'; pBar.style.width = '0%'; void pBar.offsetWidth; }
      if (interval > 0) {
        if (pBar) { pBar.style.transition = `width ${interval}ms linear`; pBar.style.width = '100%'; }
        timer = setTimeout(() => goTo(cur < total-1 ? cur+1 : 0), interval);

    }
    btnPrev && btnPrev.addEventListener('click', () => goTo(cur-1));
    btnNext && btnNext.addEventListener('click', () => goTo(cur+1));
    sections[0].classList.add('xpop-active');
    syncUI();
    startProgress();
    return { stop: () => clearTimeout(timer) };

      wrap.appendChild(src);
    }

    const hdr = document.createElement('div');
    hdr.className = 'xpop-header';
    hdr.innerHTML = title;
    wrap.appendChild(hdr);
    wrap.appendChild(body);

    if (isCarousel) {
      wrap.appendChild(progressEl);
      wrap.appendChild(barEl);
    }

    panelEl.innerHTML = '';
    panelEl.appendChild(wrap);

    if (isCarousel) {
      panelCarouselState = buildCarousel(
        Array.from(wrap.querySelectorAll('.xpop-carousel-track section')),
        wrap, cInterval, cAnim
      );
    }

    trigger.classList.add('xpop-panel-active');
    panelActiveTrigger = trigger;
  }

  function createPopover(trigger) {
    const themeName = ra(trigger, 'popoverTheme',      config.theme);
    const placement = ra(trigger, 'popoverPlacement',  config.placement);
    const bStyle    = ra(trigger, 'popoverBorder',     config.borderStyle);
    const fontSize  = ra(trigger, 'popoverFontsize',   config.fontSize);
    const maxWidth  = ra(trigger, 'popoverMaxwidth',   config.maxWidth);
    const showArrow = ra(trigger, 'popoverArrow', 'true') !== 'false';
    const title     = trigger.dataset.popoverTitle     || '';
    const cInterval = parseInt(ra(trigger, 'popoverInterval',   config.carousel.interval), 10);
    const cAnim     = ra(trigger, 'popoverCarouselAnim', config.carousel.animation);
    const theme     = getTheme(themeName);
    const html      = extractContent(trigger);

    const { isCarousel, body, progressEl, barEl } = buildContentDOM(html);

    const pop = document.createElement('div');
    pop.className = 'xpop-container';
    pop.dataset.placement = placement;
    pop.style.setProperty('--xpop-bg',           theme.bg);
    pop.style.setProperty('--xpop-title-color',  theme.titleColor);
    pop.style.setProperty('--xpop-border-color', theme.borderColor);
    pop.style.setProperty('--xpop-font-size',    fontSize);
    pop.style.setProperty('--xpop-max-width',    maxWidth);
    pop.style.borderStyle = bStyle;
    trigger.style.setProperty('--xpop-hint-color', theme.borderColor);

    if (showArrow) {
      const a = document.createElement('div');
      a.className = 'xpop-arrow';
      pop.appendChild(a);
    }

    const hdr = document.createElement('div');
    hdr.className = 'xpop-header';
    hdr.innerHTML = title;
    pop.appendChild(hdr);
    pop.appendChild(body);
    if (isCarousel) {
      pop.appendChild(progressEl);
      pop.appendChild(barEl);
    }

    document.body.appendChild(pop);

    const offset = parseInt(ra(trigger, 'popoverOffset', config.offset), 10);
    const { top, left, finalPlacement } = calcPosition(trigger, pop, placement, offset);
    pop.dataset.placement = finalPlacement;
    pop.style.setProperty('--xpop-origin', originOf(finalPlacement));
    pop.style.top  = top  + 'px';
    pop.style.left = left + 'px';
    if (isCarousel) {
      carouselState = buildCarousel(
        Array.from(pop.querySelectorAll('.xpop-carousel-track section')),
        pop, cInterval, cAnim
      );
    }
    requestAnimationFrame(() => requestAnimationFrame(() => pop.classList.add('xpop-visible')));
    return pop;
  }

  function closePop() {
    if (!currentPop) return;
    if (carouselState) { carouselState.stop(); carouselState = null; }
    const pop = currentPop;
    pop.classList.remove('xpop-visible');
    setTimeout(() => pop.parentNode && pop.parentNode.removeChild(pop), 230);
    currentPop = currentTrigger = null;
  }

  document.addEventListener('click', function (e) {
    const trigger = e.target.closest(
      '[data-popover-title],[data-popover-content],[data-popover-target]'
    );

    if (trigger) {
      e.stopPropagation();

      const modalMode = getModalMode(trigger);
      if (modalMode) {
        closePop();
        clearPanel();
        if (modalMode === 'dialog') { showModal(trigger); }
        else { showOffcanvas(trigger, modalMode); }
        return;
      }

      const panelEl = getPanelTargetEl(trigger);
      if (panelEl) {
        closePop();
        renderToPanel(trigger, panelEl);
        return;
      }

      if (currentTrigger === trigger) { closePop(); return; }
      closePop();
      currentTrigger = trigger;
      currentPop = createPopover(trigger);
      return;
    }

    if (currentPop && currentPop.contains(e.target)) return;
    closePop();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

  window.addEventListener('resize', function () {
    if (!currentPop || !currentTrigger) return;
    const p = currentTrigger.dataset.popoverPlacement || config.placement;
    const o = parseInt(ra(currentTrigger, 'popoverOffset', config.offset), 10);
    const { top, left, finalPlacement } = calcPosition(currentTrigger, currentPop, p, o);
    currentPop.dataset.placement = finalPlacement;
    currentPop.style.setProperty('--xpop-origin', originOf(finalPlacement));
    currentPop.style.top  = top  + 'px';
    currentPop.style.left = left + 'px';
  });

  injectCSS();
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════
   SESSION  — placeholder for invite-code mechanism
   ──────────────────────────────────────────────────────────────
   Future usage:
     IELTSSession.setInviteCode('XYZ123');
     IELTSSession.setUserId('u_abc');
   All localStorage keys are scoped by testId + identity.
══════════════════════════════════════════════════════════════ */
window.IELTSSession = {
  userId:      null,   // will be set by invite-code mechanism
  inviteCode:  null,   // will be set by invite-code mechanism
  testId:      null,

  setUserId(id)    { this.userId = id; },
  setInviteCode(c) { this.inviteCode = c; },

  getKey(suffix) {
    const uid = this.inviteCode || this.userId || 'guest';
    return `ielts__${this.testId || 'x'}__${uid}__${suffix}`;
  },
};

/* ══════════════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════════════ */
window.IELTSApp = (() => {

  /* ── State ─────────────────────────────────────────────────── */
  let _data          = null;
  let _passageId     = null;  // currently displayed passage
  let _answers       = {};    // { qNo: value }
  let _flags         = {};    // { qNo: true }
  let _highlights    = [];    // [{ id, passageId, color, note, label }]
  let _activeMarkEl  = null;  // currently selected <mark>
  let _timerIv       = null;
  let _secsLeft      = 3600;
  let _notePanelOpen = true;
  let _allQNos       = [];    // flat ordered list of all question numbers

  // Color → bp-popnote theme mapping
  const COLOR_THEME = {
    yellow: 'yellow', safe: 'safe', sky: 'sky', warning: 'warning', lavender: 'lavender'
  };

  // Placeholder HTML shown in floating popover when no note written yet
  const PLACEHOLDER_CONTENT =
    '<span style="opacity:0.45;font-style:italic;font-size:0.9em;">' +
    'No note yet — expand the Annotation panel below to add one.</span>';

  /* ── Public: init ──────────────────────────────────────────── */
  function init(jsonData) {
    _data = jsonData;
    IELTSSession.testId = _data.meta.test_id;

    // Apply user identity from JSON (backend may pre-fill these)
    if (_data.meta.user_id)    IELTSSession.setUserId(_data.meta.user_id);
    if (_data.meta.invite_code) IELTSSession.setInviteCode(_data.meta.invite_code);

    document.getElementById('page-title').textContent  = _data.meta.title || 'IELTS Reading';
    document.getElementById('test-title').textContent  = _data.meta.title || 'IELTS Reading';

    // Collect all question numbers in order
    _allQNos = [];
    (_data.question_groups || []).forEach(g =>
      (g.questions || []).forEach(q => _allQNos.push(q.no))
    );

    _loadAnswers();
    _loadFlags();
    _loadHighlightsData();

    _renderPassageTabs();
    _startTimer(_data.meta.time_limit || 3600);
    _renderNavigation();

    // Show first passage
    if (_data.passages && _data.passages.length > 0) {
      _switchPassage(_data.passages[0].id);
    }

    document.getElementById('loading-screen').classList.add('hidden');
  }

  /* ── Passage Tabs ──────────────────────────────────────────── */
  function _renderPassageTabs() {
    const wrap = document.getElementById('passage-tabs');
    wrap.innerHTML = '';
    (_data.passages || []).forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'passage-tab';
      btn.textContent = p.label || p.id;
      btn.dataset.pid = p.id;
      btn.addEventListener('click', () => _switchPassage(p.id));
      wrap.appendChild(btn);
    });
  }

  function _switchPassage(pid) {
    _passageId = pid;
    const p = (_data.passages || []).find(x => x.id === pid);
    if (!p) return;

    document.querySelectorAll('.passage-tab').forEach(b =>
      b.classList.toggle('active', b.dataset.pid === pid)
    );
    document.getElementById('passage-range').textContent   = p.question_range || '';
    document.getElementById('passage-heading').textContent = p.title || '';
    document.getElementById('passage-body').innerHTML      = p.body || '';

    _renderQuestions(pid);
    _restoreHighlights(pid);
    deactivateMark();
  }

  /* ── Timer ─────────────────────────────────────────────────── */
  function _startTimer(total) {
    _secsLeft = total;
    clearInterval(_timerIv);
    _updateTimer();
    _timerIv = setInterval(() => {
      if (_secsLeft <= 0) { clearInterval(_timerIv); return; }
      _secsLeft--;
      _updateTimer();
    }, 1000);
  }

  function _updateTimer() {
    const el = document.getElementById('timer-display');
    const m  = Math.floor(_secsLeft / 60);
    const s  = _secsLeft % 60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.className = _secsLeft <= 300 ? 'danger' : _secsLeft <= 600 ? 'warn' : '';
  }

  /* ── Navigation ────────────────────────────────────────────── */
  function _renderNavigation() {
    const wrap = document.getElementById('q-nav-wrap');
    wrap.innerHTML = '';
    _allQNos.forEach(no => {
      const btn = document.createElement('button');
      btn.className = 'q-nav-btn';
      btn.id = `qnav-${no}`;
      btn.textContent = no;
      if (_answers[no] !== undefined && String(_answers[no]).trim() !== '')
        btn.classList.add('answered');
      if (_flags[no]) btn.classList.add('flagged');
      btn.addEventListener('click', () => _scrollToQ(no));
      wrap.appendChild(btn);
    });
  }

  function _scrollToQ(no) {
    const el = document.getElementById(`q-item-${no}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('.q-nav-btn').forEach(b => b.classList.remove('current'));
    const nb = document.getElementById(`qnav-${no}`);
    if (nb) nb.classList.add('current');
  }

  function _navSetAnswered(no, val) {
    const nb = document.getElementById(`qnav-${no}`);
    if (nb) nb.classList.toggle('answered', val !== '' && val !== undefined && val !== null);
  }

  /* ── Question Groups ───────────────────────────────────────── */
  function _renderQuestions(pid) {
    const body = document.getElementById('question-body');
    body.innerHTML = '';
    const groups = (_data.question_groups || []).filter(g => g.passage_id === pid);
    groups.forEach((g, idx) => {
      if (idx > 0) {
        const hr = document.createElement('hr');
        hr.className = 'q-group-divider';
        body.appendChild(hr);
      }
      body.appendChild(_buildGroup(g));
    });
  }

  function _buildGroup(g) {
    const sec = document.createElement('div');
    sec.className = 'q-group';

    if (g.instruction) {
      const d = document.createElement('div');
      d.className = 'q-instruction';
      d.innerHTML = g.instruction;
      sec.appendChild(d);
    }
    if (g.sub_instruction) {
      const d = document.createElement('div');
      d.className = 'q-sub-instruction';
      d.innerHTML = g.sub_instruction;
      sec.appendChild(d);
    }

    // Matching types: show options list
    const matchTypes = ['matching','matching_headings','matching_features'];
    if (matchTypes.includes(g.type) && g.options) {
      const box = document.createElement('div');
      box.className = 'match-options-box';
      const entries = Array.isArray(g.options)
        ? g.options.map((v, i) => ({ k: _toRoman(i+1), v }))
        : Object.entries(g.options).map(([k,v]) => ({ k, v }));
      entries.forEach(({ k, v }) => {
        const row = document.createElement('div');
        row.className = 'match-opt-item';
        row.innerHTML = `<span class="match-opt-key">${k}.</span><span>${v}</span>`;
        box.appendChild(row);
      });
      sec.appendChild(box);
    }

    (g.questions || []).forEach(q => sec.appendChild(_buildQuestion(g, q)));
    return sec;
  }

  function _buildQuestion(g, q) {
    const item = document.createElement('div');
    item.className = 'q-item';
    item.id = `q-item-${q.no}`;

    const numRow = document.createElement('div');
    numRow.className = 'q-num-row';
    const numEl = document.createElement('div');
    numEl.className = 'q-number';
    numEl.textContent = `Question ${q.no}`;
    const flagBtn = document.createElement('button');
    flagBtn.className = 'q-flag-btn' + (_flags[q.no] ? ' flagged' : '');
    flagBtn.title = 'Flag for review';
    flagBtn.textContent = '⚑';
    flagBtn.addEventListener('click', () => {
      _flags[q.no] = !_flags[q.no];
      flagBtn.classList.toggle('flagged', _flags[q.no]);
      const nb = document.getElementById(`qnav-${q.no}`);
      if (nb) nb.classList.toggle('flagged', _flags[q.no]);
      _saveFlags();
    });
    numRow.appendChild(numEl);
    numRow.appendChild(flagBtn);
    item.appendChild(numRow);

    if (q.prompt) {
      const pr = document.createElement('div');
      pr.className = 'q-prompt';
      pr.innerHTML = q.prompt;
      item.appendChild(pr);
    }

    item.appendChild(_buildControl(g, q));
    return item;
  }

  function _buildControl(g, q) {
    const wrap = document.createElement('div');
    const type = g.type;
    const saved = _answers[q.no];

    if (type === 'multiple_choice') {
      wrap.className = 'mc-list';
      const opts = Array.isArray(q.options)
        ? q.options.map((v, i) => ({ k: String.fromCharCode(65+i), v }))
        : Object.entries(q.options || {}).map(([k,v]) => ({ k, v }));
      opts.forEach(({ k, v }) => {
        const lbl = document.createElement('label');
        lbl.className = 'mc-opt' + (saved === k ? ' selected' : '');
        lbl.innerHTML = `<input type="radio" name="q_${q.no}" value="${k}">` +
                        `<span class="mc-key">${k}</span><span>${v}</span>`;
        lbl.addEventListener('click', () => {
          wrap.querySelectorAll('.mc-opt').forEach(o => o.classList.remove('selected'));
          lbl.classList.add('selected');
          _setAnswer(q.no, k);
        });
        wrap.appendChild(lbl);
      });

    } else if (type === 'tfng' || type === 'ynng') {
      wrap.className = 'tfng-btns';
      const choices = g.choices || (type === 'tfng'
        ? ['TRUE', 'FALSE', 'NOT GIVEN']
        : ['YES', 'NO', 'NOT GIVEN']);
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'tfng-btn' + (saved === c ? ' selected' : '');
        btn.textContent = c;
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.tfng-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          _setAnswer(q.no, c);
        });
        wrap.appendChild(btn);
      });

    } else if (['matching','matching_headings','matching_features'].includes(type)) {
      const sel = document.createElement('select');
      sel.className = 'match-select';
      const def = document.createElement('option');
      def.value = ''; def.textContent = '— Select —';
      sel.appendChild(def);
      const entries = Array.isArray(g.options)
        ? g.options.map((v, i) => ({ k: _toRoman(i+1), v }))
        : Object.entries(g.options || {}).map(([k,v]) => ({ k, v }));
      entries.forEach(({ k, v }) => {
        const o = document.createElement('option');
        o.value = k;
        o.textContent = `${k}. ${String(v).slice(0,55)}${String(v).length>55?'…':''}`;
        sel.appendChild(o);
      });
      if (saved) sel.value = saved;
      sel.addEventListener('change', () => _setAnswer(q.no, sel.value));
      wrap.appendChild(sel);

    } else if (type === 'completion' || type === 'short_answer') {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'text-input';
      inp.placeholder = type === 'completion'
        ? 'Write your answer (observe word limit)'
        : 'Write your answer here';
      inp.value = saved || '';
      inp.addEventListener('input', () => _setAnswer(q.no, inp.value));
      wrap.appendChild(inp);

    } else {

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'text-input';
      inp.placeholder = 'Answer…';
      inp.value = saved || '';
      inp.addEventListener('input', () => _setAnswer(q.no, inp.value));
      wrap.appendChild(inp);
    }

    return wrap;
  }

  function _setAnswer(no, val) {
    _answers[no] = val;
    _saveAnswers();
    _navSetAnswered(no, val);
  }

  function _saveAnswers() {
    try { localStorage.setItem(IELTSSession.getKey('ans'), JSON.stringify(_answers)); } catch(e) {}
  }
  function _loadAnswers() {
    try { const r = localStorage.getItem(IELTSSession.getKey('ans')); if(r) _answers = JSON.parse(r); } catch(e) {}
  }
  function _saveFlags() {
    try { localStorage.setItem(IELTSSession.getKey('flags'), JSON.stringify(_flags)); } catch(e) {}
  }
  function _loadFlags() {
    try { const r = localStorage.getItem(IELTSSession.getKey('flags')); if(r) _flags = JSON.parse(r); } catch(e) {}
  }

  function addHighlight(color) {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) return;
    const range = sel.getRangeAt(0);
    const passageBody = document.getElementById('passage-body');
    if (!passageBody.contains(range.commonAncestorContainer)) return;

    const markId = 'hl_' + Date.now() + '_' + Math.floor(Math.random() * 9999);
    const label  = sel.toString().trim().slice(0, 50);

    const _wrapRange = (r) => {
      const mark = document.createElement('mark');
      mark.className = `hl hl-${color}`;
      mark.dataset.markId        = markId;
      mark.dataset.color         = color;
      mark.dataset.popoverContent  = PLACEHOLDER_CONTENT;
      mark.dataset.popoverTheme    = COLOR_THEME[color] || 'lavender';
      mark.dataset.popoverHint     = 'false';
      mark.dataset.popoverLabel    = label;
      mark.dataset.popoverMaxwidth = '360px';
      return mark;
    };

    try {
      const mark = _wrapRange(range);
      range.surroundContents(mark);
      sel.removeAllRanges();
      _highlights.push({ id: markId, passageId: _passageId, color, note: '', label });
      _saveHighlights();
      activateMark(mark);
    } catch (e) {
      try {
        const frag = range.extractContents();
        const mark = _wrapRange(range);
        mark.appendChild(frag);
        range.insertNode(mark);
        sel.removeAllRanges();
        _highlights.push({ id: markId, passageId: _passageId, color, note: '', label });
        _saveHighlights();
        activateMark(mark);
      } catch (e2) { console.warn('Highlight failed:', e2); }
    }
    _hideToolbar();
  }

  function activateMark(markEl) {
    if (_activeMarkEl && _activeMarkEl !== markEl) {
      _activeMarkEl.classList.remove('xpop-panel-active');
    }
    _activeMarkEl = markEl;
    markEl.classList.add('xpop-panel-active');

    const stored = _highlights.find(h => h.id === markEl.dataset.markId);
    const note   = stored?.note || '';

    document.getElementById('note-textarea').value = note;
    document.getElementById('note-edit-area').style.display = 'block';
    document.getElementById('note-panel-hint').textContent =
      '"' + (markEl.dataset.popoverLabel || markEl.textContent).slice(0, 38) + '…"';
  }

  function deactivateMark() {
    if (_activeMarkEl) _activeMarkEl.classList.remove('xpop-panel-active');
    _activeMarkEl = null;
    document.getElementById('note-edit-area').style.display = 'none';
    document.getElementById('note-panel-hint').textContent = 'Click a highlight to edit its note';
  }

  function saveNote() {
    if (!_activeMarkEl) return;
    const note = document.getElementById('note-textarea').value.trim();
    _activeMarkEl.dataset.popoverContent = note || PLACEHOLDER_CONTENT;
    const stored = _highlights.find(h => h.id === _activeMarkEl.dataset.markId);
    if (stored) stored.note = note;
    _saveHighlights();
  }

  function deleteHighlight() {
    if (!_activeMarkEl) return;
    const mid = _activeMarkEl.dataset.markId;
    const p   = _activeMarkEl.parentNode;
    while (_activeMarkEl.firstChild) p.insertBefore(_activeMarkEl.firstChild, _activeMarkEl);
    p.removeChild(_activeMarkEl);
    _highlights = _highlights.filter(h => h.id !== mid);
    _saveHighlights();
    deactivateMark();
  }

  function _saveHighlights() {
    try { localStorage.setItem(IELTSSession.getKey('hl'), JSON.stringify(_highlights)); } catch(e) {}
  }
  function _loadHighlightsData() {
    try { const r = localStorage.getItem(IELTSSession.getKey('hl')); if(r) _highlights = JSON.parse(r); } catch(e) {}
  }
  function _restoreHighlights(pid) {
    _loadHighlightsData();
  }

  function toggleNotePanel() {
    _notePanelOpen = !_notePanelOpen;
    document.getElementById('note-panel-body').classList.toggle('collapsed', !_notePanelOpen);
    document.getElementById('note-chevron').textContent = _notePanelOpen ? '▲' : '▼';
  }

  function _showToolbar(rect) {
    const tb = document.getElementById('hl-toolbar');
    tb.style.display = 'flex';
    const w = 200;
    const x = Math.max(8, Math.min(rect.left + rect.width / 2 - w / 2, window.innerWidth - w - 8));
    const y = Math.max(8, rect.top - 52);
    tb.style.left = x + 'px';
    tb.style.top  = y + 'px';
  }

  function _hideToolbar() {
    document.getElementById('hl-toolbar').style.display = 'none';
  }

  function _escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
  }

  function _toRoman(n) {
    const v=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
    const d=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
    let r=''; d.forEach((x,i)=>{ while(n>=x){r+=v[i];n-=x;} });
    return r.toLowerCase();
  }

  function _initEvents() {
    document.addEventListener('click', e => {
      const mark = e.target.closest('mark.hl');
      if (mark) {

        activateMark(mark);
        return;
      }

      if (!e.target.closest('#note-panel-wrap') && !e.target.closest('#hl-toolbar')) {
        deactivateMark();
      }
    }, true);
    document.addEventListener('mouseup', e => {
      if (e.target.closest('#hl-toolbar')) return;
      if (e.target.closest('mark.hl')) return;

      const sel = window.getSelection();
      if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {
        const pb = document.getElementById('passage-body');
        try {
          const range = sel.getRangeAt(0);
          if (pb.contains(range.commonAncestorContainer)) {
            _showToolbar(range.getBoundingClientRect());
            return;
          }
        } catch(e) {}
      }
      _hideToolbar();
    });

    document.addEventListener('selectionchange', () => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) _hideToolbar();
    });

    document.querySelectorAll('.hl-color-btn').forEach(btn =>
      btn.addEventListener('click', e => { e.stopPropagation(); addHighlight(btn.dataset.color); })
    );
    document.getElementById('hl-remove-btn').addEventListener('click', e => {
      e.stopPropagation(); deleteHighlight(); _hideToolbar();
    });

    (function() {
      const divider  = document.getElementById('divider');
      const leftPane = document.getElementById('left-pane');
      const layout   = document.getElementById('main-layout');
      let drag=false, sx=0, sw=0;
      divider.addEventListener('mousedown', e => {
        drag=true; sx=e.clientX; sw=leftPane.offsetWidth;
        divider.classList.add('dragging');
        document.body.style.cursor='col-resize';
        document.body.style.userSelect='none';
      });
      document.addEventListener('mousemove', e => {
        if (!drag) return;
        const nw = Math.min(Math.max(sw + e.clientX - sx, 260), layout.offsetWidth - 260);
        leftPane.style.width=''; leftPane.style.flex='none'; leftPane.style.width=nw+'px';
      });
      document.addEventListener('mouseup', () => {
        if (!drag) return; drag=false;
        divider.classList.remove('dragging');
        document.body.style.cursor=''; document.body.style.userSelect='';
      });
    })();
  }

  return {
    init, addHighlight, deleteHighlight, activateMark, deactivateMark,
    saveNote, toggleNotePanel,
    _initEvents,

    getAnswers() { return { ..._answers }; },
    getFlags()   { return { ..._flags   }; },
    getHighlights() { return [..._highlights]; },
  };
})();

function saveNote()      { IELTSApp.saveNote(); }
function deleteHighlight(){ IELTSApp.deleteHighlight(); }

async function _loadTestData() {
  IELTSApp._initEvents();

  const params  = new URLSearchParams(location.search);
  const dataUrl = params.get('data');

  if (dataUrl) {
    try {
      const res  = await fetch(dataUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      IELTSApp.init(await res.json());
      return;
    } catch (err) {
      console.error('[IELTS] fetch failed:', err);
    }
  }

  const inlineEl = document.getElementById('ielts-data');
  if (inlineEl) {
    try { IELTSApp.init(JSON.parse(inlineEl.textContent)); return; }
    catch (err) { console.error('[IELTS] inline JSON parse error:', err); }
  }

  IELTSApp.init(_MOCK_DATA);
}
