<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nelson IELTS</title>
  <style>
    :root {
      --bg:#0C0D0C;--shell:#C6C7BD;--lavender:#C3A5E5;--sky:#82C8E5;
      --salmon:#E5C3B3;--ocean:#1CCAE8;--safe:#27AE60;--teal:#0DA591;
      --vanilla:#DBEDD8;--yellow:#E3D322;--focus:#D4FFFC;--indigo:#7849C9;
      --special:#B3DE73;--orange:#EDA109;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--shell);font-family:'Microsoft JhengHei','PingFang TC','Segoe UI',Arial,sans-serif;font-size:1.125rem;line-height:1.5;min-height:100vh}
    .site-header{padding:44px 64px 36px;background:linear-gradient(135deg,rgba(195,165,229,0.12),rgba(28,202,232,0.08));border-bottom:1px solid rgba(195,165,229,0.22)}
    .site-header h1{font-size:2rem;color:var(--lavender);letter-spacing:.01em;margin-bottom:8px}
    .site-header>p{color:rgba(198,199,189,0.82);font-size:1rem}
    .how-to{margin-top:22px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
    .how-step{display:flex;align-items:center;gap:9px;font-size:0.9rem;color:rgba(198,199,189,0.82)}
    .step-n{width:22px;height:22px;border-radius:50%;background:rgba(195,165,229,0.20);color:var(--lavender);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.78rem;flex-shrink:0}
    .clue-focus{color:var(--focus);font-weight:700}
    .clue-yellow{color:var(--yellow);font-weight:700}
    .stats-bar{display:flex;align-items:center;gap:32px;padding:16px 64px;background:rgba(198,199,189,0.04);border-bottom:1px solid rgba(198,199,189,0.09);flex-wrap:wrap}
    .stat{display:flex;align-items:center;gap:8px;font-size:0.9rem}
    .slbl{color:rgba(198,199,189,0.80)}
    .sval{color:var(--ocean);font-weight:700;font-size:1rem}
    .prog-wrap{flex:1;min-width:200px;display:flex;align-items:center;gap:12px}
    .prog-track{flex:1;height:5px;background:rgba(198,199,189,0.15);border-radius:3px;overflow:hidden}
    .prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--ocean));transition:width .35s ease}
    .prog-pct{color:var(--teal);font-size:0.85rem;font-weight:700;min-width:38px}
    .tab-nav{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 64px;border-bottom:2px solid rgba(198,199,189,0.10)}
    .tab-nav::-webkit-scrollbar{display:none}
    .tab-btn{padding:13px 18px;border:none;border-bottom:3px solid transparent;background:none;color:rgba(198,199,189,0.80);font-size:0.9rem;font-family:inherit;cursor:pointer;white-space:nowrap;position:relative;bottom:-2px;transition:color .2s}
    .tab-btn:hover{color:var(--shell)}
    .tab-btn.active{font-weight:700}
    .tab-btn[data-t="0"].active{border-bottom-color:var(--lavender);color:var(--lavender)}
    .tab-btn[data-t="1"].active{border-bottom-color:var(--sky);color:var(--sky)}
    .tab-btn[data-t="2"].active{border-bottom-color:var(--salmon);color:var(--salmon)}
    .tab-btn[data-t="3"].active{border-bottom-color:var(--teal);color:var(--teal)}
    .tab-btn[data-t="4"].active{border-bottom-color:var(--ocean);color:var(--ocean)}
    .tab-btn[data-t="5"].active{border-bottom-color:var(--special);color:var(--special)}
    .tab-btn[data-t="6"].active{border-bottom-color:var(--orange);color:var(--orange)}
    .tab-btn[data-t="4"]{display:none}
    .tb-bdg{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:12px;font-size:0.72rem;background:rgba(198,199,189,0.12)}
    .panel{display:none;padding:40px 64px 64px}
    .panel.active{display:block}
    #p4{display:none!important}
    .intro-box{padding:20px 24px;border-radius:10px;border-left:4px solid;margin-bottom:28px}
    .intro-box h2{font-size:1.2rem;margin-bottom:8px}
    .intro-desc{color:rgba(198,199,189,0.82);font-size:1rem;margin-bottom:12px;line-height:1.5}
    .intro-pat{display:inline-block;padding:4px 16px;border-radius:16px;font-family:'Courier New',monospace;font-size:0.85rem;background:rgba(198,199,189,0.10);color:var(--vanilla);letter-spacing:.03em}
    .ib0{border-color:var(--lavender);background:rgba(195,165,229,0.07)}.ih0{color:var(--lavender)}
    .ib1{border-color:var(--sky);background:rgba(130,200,229,0.07)}.ih1{color:var(--sky)}
    .ib2{border-color:var(--salmon);background:rgba(229,195,179,0.07)}.ih2{color:var(--salmon)}
    .ib3{border-color:var(--teal);background:rgba(13,165,145,0.07)}.ih3{color:var(--teal)}
    .ib4{border-color:var(--ocean);background:rgba(28,202,232,0.07)}.ih4{color:var(--ocean)}
    .ib5{border-color:var(--special);background:rgba(179,222,115,0.07)}.ih5{color:var(--special)}
    .ib6{border-color:var(--orange);background:rgba(237,161,9,0.07)}.ih6{color:var(--orange)}
    .p-acts{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}
    .pact{padding:7px 18px;border-radius:6px;border:1px solid;background:none;cursor:pointer;font-family:inherit;font-size:0.9rem;transition:background .18s}
    .pact-exp{color:var(--lavender);border-color:rgba(195,165,229,0.32)}
    .pact-exp:hover{background:rgba(195,165,229,0.12)}
    .pact-col{color:rgba(198,199,189,0.80);border-color:rgba(198,199,189,0.22)}
    .pact-col:hover{background:rgba(198,199,189,0.08)}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:18px}
    .card{background:rgba(198,199,189,0.06);border:1px solid rgba(198,199,189,0.13);border-radius:12px;padding:22px 24px;transition:border-color .2s,box-shadow .2s}
    .card:hover{box-shadow:0 4px 22px rgba(0,0,0,0.45)}
    .card.revealed{border-color:rgba(28,202,232,0.28)}
    .card-id{font-size:0.8rem;color:rgba(198,199,189,0.80);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
    .cn-phr{font-size:1.2rem;color:var(--vanilla);font-weight:500;margin-bottom:18px;line-height:1.45}
    .rev-btn{display:inline-flex;align-items:center;gap:8px;padding:7px 18px;border-radius:6px;border:1px solid rgba(28,202,232,0.30);background:rgba(28,202,232,0.10);color:var(--ocean);cursor:pointer;font-family:inherit;font-size:0.9rem;transition:background .18s}
    .rev-btn:hover{background:rgba(28,202,232,0.22)}
    .ricon{display:inline-block;transition:transform .2s;font-size:0.75rem}
    .card.revealed .ricon{transform:rotate(90deg)}
    .card-ans{display:none;margin-top:18px;padding-top:18px;border-top:1px solid rgba(198,199,189,0.10);animation:fadeUp .22s ease}
    .card.revealed .card-ans{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    .en-line{margin-bottom:14px;line-height:1.5;font-size:1.05rem}
    .en-head{color:var(--focus);font-weight:600}
    .en-mod{color:var(--yellow);font-weight:700}
    .ielts-row{display:flex;align-items:flex-start;gap:10px}
    .badge{display:inline-block;padding:3px 11px;border-radius:4px;font-size:0.78rem;font-weight:700;letter-spacing:.04em;white-space:nowrap;flex-shrink:0;margin-top:1px}
    .bp1{background:rgba(39,174,96,0.18);color:var(--safe);border:1px solid rgba(39,174,96,0.32)}
    .bp2{background:rgba(120,73,201,0.18);color:#B08BE5;border:1px solid rgba(120,73,201,0.32)}
    .ielts-q{color:rgba(198,199,189,0.82);font-size:0.9rem;font-style:italic;line-height:1.45}
    .adv-tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:4px;font-size:0.72rem;font-weight:700;background:rgba(237,161,9,0.18);color:var(--orange);border:1px solid rgba(237,161,9,0.32);vertical-align:middle}
    .type-legend{display:flex;gap:20px;flex-wrap:wrap;padding:16px 64px;border-top:1px solid rgba(198,199,189,0.09);background:rgba(198,199,189,0.03)}
    .legend-item{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:rgba(198,199,189,0.80)}
    .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    @media(max-width:900px){
      .site-header{padding:28px 20px 24px}
      .stats-bar{padding:14px 20px}
      .tab-nav{padding:0 20px}
      .panel{padding:28px 20px 48px}
      .cards-grid{grid-template-columns:1fr}
      .type-legend{padding:14px 20px}
    }
</style>
</head>

<div class="stats-bar" style="display:none;">
  <div class="stat">
    <span class="slbl">已翻譯</span>
    <span class="sval" id="cnt">0</span>
    <span class="slbl" id="totalLbl">/ 0</span>
  </div>
  <div class="prog-wrap">
    <span class="slbl">整體進度</span>
    <div class="prog-track"><div class="prog-fill" id="pFill"></div></div>
    <span class="prog-pct" id="pPct">0%</span>
  </div>
</div>

<nav class="tab-nav" id="tabNav"></nav>
<div id="panels"></div>
<div class="type-legend" id="legend"></div>

<script>
const TYPES = [{"name": "介詞片語", "en": "Prepositional Phrases", "pattern": "Noun  +  介詞（of / about / for / in / with / at）  +  (Noun Phrase)", "intro": "最常見的後位修飾結構。中文習慣把修飾語放在名詞「前面」，英文則用介詞片語接在名詞「後面」。本類型也收錄「年齡人口描述」子模式（under 35、in their late thirties 等），以及 at the heart of 這類高畫面感語塊。", "hidden": false, "cards": [{"cn": "學習第二語言的好處", "head": "the benefits", "mod": "of learning a second language", "p": 1, "q": "What do you think are the main advantages of learning a foreign language?"}, {"cn": "科技對年輕人的影響", "head": "the impact", "mod": "of technology on young people", "p": 2, "q": "Describe a change you have noticed in the world around you."}, {"cn": "對環境問題的關注", "head": "concerns", "mod": "about environmental issues", "p": 1, "q": "Are you personally concerned about environmental problems?"}, {"cn": "在大城市生活的挑戰", "head": "the challenges", "mod": "of living in a big city", "p": 1, "q": "Do you prefer living in a city or the countryside? Why?"}, {"cn": "在課堂上使用手機的規定", "head": "the rules", "mod": "about using mobile phones in class", "p": 1, "q": "Do you think students should be allowed to use phones at school?"}, {"cn": "對傳統文化的尊重", "head": "respect", "mod": "for traditional culture", "p": 2, "q": "Describe a traditional celebration or festival in your country."}, {"cn": "在高壓環境中維持心理健康的重要性", "head": "the importance", "mod": "of maintaining mental health in a high-pressure environment", "p": 2, "q": "Describe a challenge you have successfully overcome."}, {"cn": "規律運動對身體的益處", "head": "the health benefits", "mod": "of regular exercise", "p": 1, "q": "How often do you exercise, and what kind of exercise do you prefer?"}, {"cn": "年輕人對職涯選擇的困惑", "head": "the confusion", "mod": "among young people about career choices", "p": 2, "q": "Describe a difficult decision you had to make about your future."}, {"cn": "遠距工作帶來的滿足感", "head": "the satisfaction", "mod": "of working remotely", "p": 1, "q": "Do you prefer working from home or in an office?"}, {"cn": "父母在子女教育中扮演的角色", "head": "the role", "mod": "of parents in their children's education", "p": 1, "q": "How involved should parents be in their children's learning?"}, {"cn": "全球化對在地文化的衝擊", "head": "the impact", "mod": "of globalisation on local cultures", "p": 2, "q": "Describe a cultural tradition that you think is at risk of disappearing."}, {"cn": "高齡化社會對醫療體系的壓力", "head": "the pressure", "mod": "on healthcare systems from an ageing society", "p": 2, "q": "Describe a social problem that you think needs urgent attention."}, {"cn": "在異鄉生活的孤獨感", "head": "the loneliness", "mod": "of living in a foreign country", "p": 2, "q": "Describe a time when you felt lonely or homesick."}, {"cn": "網路上資訊過剩的問題", "head": "the problem", "mod": "of information overload on the internet", "p": 1, "q": "Do you think people spend too much time reading information online?"}, {"cn": "現代人對健康飲食的重視", "head": "the emphasis", "mod": "on healthy eating among modern people", "p": 1, "q": "Do you pay more attention to what you eat than you used to?"}, {"cn": "三十五歲以下的成年人", "head": "adults", "mod": "under 35", "p": 1, "q": "What do you think are the main pressures facing people your age?"}, {"cn": "三十五到四十歲之間的職業女性", "head": "professional women", "mod": "between 35 and 40", "p": 2, "q": "Describe a person who has managed career and family responsibilities well."}, {"cn": "三十歲後半的上班族", "head": "office workers", "mod": "in their late thirties", "p": 2, "q": "Describe a time in your life when you felt particularly under pressure."}, {"cn": "六十歲以上的長者", "head": "residents", "mod": "aged 60 and above", "p": 2, "q": "Describe an elderly person who has had a positive impact on you."}, {"cn": "超過退休年齡仍繼續工作的人", "head": "people", "mod": "beyond retirement age who continue to work", "p": 1, "q": "Do you think the retirement age should be raised in your country?"}, {"cn": "位居台灣飲食文化核心的夜市傳統", "head": "the night market tradition", "mod": "at the heart of Taiwanese food culture", "p": 2, "q": "Describe a cultural tradition that is important in your country."}]}, {"name": "現在分詞片語", "en": "Present Participial Phrases", "pattern": "Noun  +  V-ing  +  (phrase)", "intro": "以動詞的現在分詞（V-ing）開頭，放在名詞後面，表示「主動進行的動作或狀態」。本類型新增 stemming from，可用來描述問題或現象的根源，在口說中展示分析能力相當有效。", "hidden": false, "cards": [{"cn": "住在偏遠地區的人", "head": "people", "mod": "living in remote areas", "p": 1, "q": "Do you think rural life is better or worse than city life?"}, {"cn": "花大量時間在社交媒體上的年輕人", "head": "young people", "mod": "spending a lot of time on social media", "p": 1, "q": "How much time do you spend on social media each day?"}, {"cn": "正在快速改變我們溝通方式的科技", "head": "technology", "mod": "rapidly changing the way we communicate", "p": 2, "q": "Describe a piece of technology that has changed your daily life."}, {"cn": "在國外工作的台灣人", "head": "Taiwanese people", "mod": "working abroad", "p": 2, "q": "Describe a person who has had a positive influence on your career."}, {"cn": "每天步行上班的通勤族", "head": "commuters", "mod": "walking to work every day", "p": 1, "q": "How do you usually get to work or school?"}, {"cn": "在公園晨跑的老年人", "head": "elderly people", "mod": "jogging in the park in the morning", "p": 1, "q": "Do older people in your country tend to keep active?"}, {"cn": "坐在我旁邊的陌生人", "head": "the stranger", "mod": "sitting next to me", "p": 2, "q": "Describe a person you met unexpectedly and found interesting."}, {"cn": "在難民營照顧兒童的志工", "head": "volunteers", "mod": "caring for children in refugee camps", "p": 2, "q": "Describe a time when you or someone you know helped others in need."}, {"cn": "深夜在辦公室加班的員工", "head": "employees", "mod": "working overtime at the office late at night", "p": 1, "q": "Do you think people in your country work too many hours?"}, {"cn": "試圖說服孩子吃蔬菜的父母", "head": "parents", "mod": "trying to convince their children to eat vegetables", "p": 1, "q": "How do children develop healthy eating habits in your country?"}, {"cn": "為氣候變遷感到憂慮的科學家", "head": "scientists", "mod": "expressing deep concern about climate change", "p": 2, "q": "Describe an environme const DOT_COLORS = [
  'var(--lavender)','var(--sky)','var(--salmon)',
  'var(--teal)','var(--ocean)','var(--special)','var(--orange)'
];
const TOTAL = TYPES.filter(t => !t.hidden).reduce((s,t) => s + t.cards.length, 0);

function buildUI() {
  const tabNav = document.getElementById('tabNav');
  const panels = document.getElementById('panels');
  const legend = document.getElementById('legend');
  document.getElementById('totalLbl').textContent = '/ ' + TOTAL;

  TYPES.forEach((type, ti) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.t = ti;
    if (type.hidden) btn.style.display = 'none';
    btn.innerHTML = `${type.name}<span class="tb-bdg">${type.cards.length}</span>`;
    btn.onclick = () => switchTab(ti);
    tabNav.appendChild(btn);

    const sec = document.createElement('section');
    sec.className = 'panel';
    sec.id = `p${ti}`;
    if (type.hidden) sec.style.display = 'none';
    sec.innerHTML = `
      <div class="intro-box ib${ti}">
        <h2 class="ih${ti}">Type ${ti+1}&ensp;${type.name}
          <span style="font-size:.84em;font-weight:400;color:rgba(198,199,189,0.82)">— ${type.en}</span>
        </h2>
        <p class="intro-desc">${type.intro}</p>
        <code class="intro-pat">${type.pattern}</code>
      </div>
      <div class="p-acts">
        <button class="pact pact-exp" data-pi="${ti}">▼ 全部展開</button>
        <button class="pact pact-col" data-pi="${ti}">▲ 全部收合</button>
      </div>
      <div class="cards-grid" id="g${ti}"></div>
    `;
    panels.appendChild(sec);

    const grid = document.getElementById(`g${ti}`);
    type.cards.forEach((c, ci) => {
      const d = document.createElement('div');
      d.className = 'card';
      d.dataset.pi = ti;
      d.dataset.hidden = type.hidden ? 'true' : 'false';
      const advTag = c.adv ? '<span class="adv-tag">進階</span>' : '';
      d.innerHTML = `
        <div class="card-id">${type.name} &middot; ${String(ci+1).padStart(2,'0')}${advTag}</div>
        <div class="cn-phr">${c.cn}</div>
        <button class="rev-btn"><span class="ricon">▶</span><span class="rlbl">查看英文</span></button>
        <div class="card-ans">
          <div class="en-line">
            <span class="en-head">${c.head}&thinsp;</span><span class="en-mod">${c.mod}</span>
          </div>
          <div class="ielts-row">
            <span class="badge bp${c.p}">Part ${c.p}</span>
            <span class="ielts-q">"${c.q}"</span>
          </div>
        </div>
      `;
      d.querySelector('.rev-btn').onclick = () => {
        const on = d.classList.toggle('revealed');
        d.querySelector('.rlbl').textContent = on ? '收合' : '查看英文';
        updateStats();
      };
      grid.appendChild(d);
    });

    if (!type.hidden) {
      const li = document.createElement('div');
      li.className = 'legend-item';
      li.innerHTML = `<span class="leg-dot" style="background:${DOT_COLORS[ti]}"></span>Type ${ti+1} ${type.name}`;
      legend.appendChild(li);
    }
  });

  legend.insertAdjacentHTML('beforeend', `
    <div class="legend-item" style="margin-left:auto;">
      <span class="badge bp1">Part 1</span><span style="margin-left:6px;">一般問答</span>
    </div>
    <div class="legend-item">
      <span class="badge bp2">Part 2</span><span style="margin-left:6px;">個人描述</span>
    </div>
  `);

  const firstVisible = TYPES.findIndex(t => !t.hidden);
  if (firstVisible >= 0) switchTab(firstVisible);
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.pact');
  if (!btn) return;
  const pi = btn.dataset.pi;
  const isExp = btn.classList.contains('pact-exp');
  document.querySelectorAll(`.card[data-pi="${pi}"]`).forEach(c => {
    c.classList.toggle('revealed', isExp);
    c.querySelector('.rlbl').textContent = isExp ? '收合' : '查看英文';
  });
  updateStats();
});

function switchTab(ti) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const btn = document.querySelector(`.tab-btn[data-t="${ti}"]`);
  const panel = document.getElementById(`p${ti}`);
  if (btn) btn.classList.add('active');
  if (panel && !TYPES[ti].hidden) panel.classList.add('active');
}

function updateStats() {
  const done = [...document.querySelectorAll('.card.revealed')]
    .filter(c => c.dataset.hidden !== 'true').length;
  document.getElementById('cnt').textContent = done;
  const pct = Math.round(done / TOTAL * 100);
  document.getElementById('pFill').style.width = pct + '%';
  document.getElementById('pPct').textContent = pct + '%';
}

buildUI();

</script>
</body>
</html>
